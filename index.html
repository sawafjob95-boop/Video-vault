<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Video Vault</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px}.sub{color:#cbd5e1;font-size:13px;margin-top:4px}
.search{margin-top:15px;width:100%;padding:13px 15px;border:0;border-radius:14px;font-size:15px;outline:none}
.wrap{max-width:760px;margin:auto;padding:16px}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.cat{white-space:nowrap;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:9px 13px;font-size:13px}.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px;box-shadow:0 2px 8px #00000008}.row{display:flex;justify-content:space-between;gap:10px}.title{font-weight:700;font-size:16px;line-height:1.45}.meta{font-size:12px;color:var(--muted);margin-top:7px}.note{font-size:13px;color:#374151;margin-top:9px;line-height:1.5}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:11px;padding:9px 12px;background:#eef2ff;color:#1e40af;font-size:13px}.danger{background:#fee2e2;color:#991b1b}.fav{font-size:22px;background:none;border:0}.empty{text-align:center;color:var(--muted);padding:55px 20px}
.fab{position:fixed;left:20px;bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 8px 25px #2563eb55}
dialog{border:0;border-radius:20px;width:min(92%,520px);padding:0;box-shadow:0 20px 60px #0005}dialog::backdrop{background:#0007}.modal{padding:20px}.modal h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:6px;color:#374151}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:14px}.field textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:15px}.primary{background:var(--accent);color:#fff}
.stats{display:flex;gap:8px;margin-bottom:12px}.stat{background:white;border:1px solid var(--border);border-radius:14px;padding:10px 13px;font-size:12px;flex:1}.stat b{display:block;font-size:19px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>🎬 Video Vault</h1>
    <div class="sub">كل فيديوهاتك المهمة في مكان واحد</div>
    <input id="search" class="search" placeholder="🔍 ابحث عن فيديو أو ملاحظة...">
  </div>
</header>
<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="total">0</b>كل الفيديوهات</div>
    <div class="stat"><b id="favCount">0</b>المفضلة ⭐</div>
  </div>
  <div id="cats" class="cats"></div>
  <div id="list" class="grid"></div>
</main>
<button class="fab" onclick="openAdd()">＋</button>

<dialog id="dlg">
 <div class="modal">
  <h2 id="modalTitle">إضافة فيديو</h2>
  <div class="field"><label>اسم الفيديو</label><input id="title" placeholder="مثلاً: شرح Excel مهم"></div>
  <div class="field"><label>لينك الفيديو</label><input id="url" type="url" placeholder="https://..."></div>
  <div class="field"><label>التصنيف</label><select id="cat"></select></div>
  <div class="field"><label>ملاحظة (اختياري)</label><textarea id="note" placeholder="ليه حفظت الفيديو؟"></textarea></div>
  <div class="modal-actions"><button class="btn" onclick="dlg.close()">إلغاء</button><button class="btn primary" onclick="saveVideo()">حفظ الفيديو</button></div>
 </div>
</dialog>

<script>
const CATS=[
 ["all","الكل"],["work","💼 Work"],["study","📚 Study / CCP"],["cars","🚗 Cars"],
 ["cafe","☕ Cafe"],["ideas","💡 Ideas"],["fitness","🏋️ Fitness"],
 ["ent","😂 Entertainment"],["important","⭐ Important"]
];
let data=JSON.parse(localStorage.getItem("videoVault")||"[]");
let active="all", editId=null;
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem("videoVault",JSON.stringify(data));}
function renderCats(){
 $("cats").innerHTML=CATS.map(c=>`<button class="cat ${active===c[0]?'active':''}" onclick="setCat('${c[0]}')">${c[1]}</button>`).join("");
 $("cat").innerHTML=CATS.filter(c=>c[0]!=="all").map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("");
}
function setCat(c){active=c;render();renderCats()}
function render(){
 const q=$("search").value.trim().toLowerCase();
 let items=data.filter(v=>(active==="all"||v.cat===active)&&(v.title+" "+v.note).toLowerCase().includes(q));
 $("total").textContent=data.length;$("favCount").textContent=data.filter(v=>v.fav).length;
 $("list").innerHTML=items.length?items.map(v=>`
 <article class="card">
  <div class="row"><div><div class="title">${esc(v.title)}</div><div class="meta">${catName(v.cat)} · ${esc(v.platform||"Link")}</div></div>
  <button class="fav" onclick="toggleFav('${v.id}')">${v.fav?"⭐":"☆"}</button></div>
  ${v.note?`<div class="note">${esc(v.note)}</div>`:""}
  <div class="actions"><button class="btn" onclick="window.open('${safeUrl(v.url)}','_blank')">▶ فتح الفيديو</button><button class="btn" onclick="editVideo('${v.id}')">✏️ تعديل</button><button class="btn danger" onclick="delVideo('${v.id}')">حذف</button></div>
 </article>`).join(""):`<div class="empty">مفيش فيديوهات هنا لسه.<br>اضغط ＋ واحفظ أول فيديو.</div>`;
}
function catName(c){return (CATS.find(x=>x[0]===c)||["",""])[1]}
function platform(url){try{let h=new URL(url).hostname;return h.includes("tiktok")?"TikTok":h.includes("facebook")?"Facebook":h.replace("www.","")}catch{return"Link"}}
function safeUrl(u){return /^https?:\/\//i.test(u)?u.replace(/'/g,"%27"):"#"}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openAdd(){editId=null;$("modalTitle").textContent="إضافة فيديو";$("title").value="";$("url").value="";$("note").value="";$("cat").value="work";dlg.showModal()}
function saveVideo(){
 let title=$("title").value.trim(),url=$("url").value.trim(),cat=$("cat").value,note=$("note").value.trim();
 if(!title||!url){alert("اكتب اسم الفيديو واللينك");return}
 if(editId){let v=data.find(x=>x.id===editId);Object.assign(v,{title,url,cat,note,platform:platform(url)})}
 else data.unshift({id:Date.now().toString(),title,url,cat,note,platform:platform(url),fav:false});
 persist();dlg.close();render();
}
function editVideo(id){let v=data.find(x=>x.id===id);editId=id;$("modalTitle").textContent="تعديل الفيديو";$("title").value=v.title;$("url").value=v.url;$("cat").value=v.cat;$("note").value=v.note||"";dlg.showModal()}
function delVideo(id){if(confirm("تحب تحذف الفيديو؟")){data=data.filter(v=>v.id!==id);persist();render()}}
function toggleFav(id){let v=data.find(x=>x.id===id);v.fav=!v.fav;persist();render()}
$("search").addEventListener("input",render);
renderCats();render();
</script>
</body>
</html>
